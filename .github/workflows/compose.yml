name: Docker Compose

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_FILE: docker-compose.yaml:compose.build.yaml
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and start
        run: docker compose up --build -d
      - name: Verify the app and encoder
        run: |
          host_ip=$(ip -4 route get 1.1.1.1 | awk '{for (i=1;i<NF;i++) if ($i=="src") {print $(i+1); exit}}')
          test -n "$host_ip"
          curl --noproxy '*' -fsS --retry 10 --retry-connrefused --retry-delay 1 "http://$host_ip:8842/" | grep -F 'MP3 Segment Cut'
          curl -fsS http://localhost:8842/vendor/lame.min.js -o /tmp/lame.min.js
          test -s /tmp/lame.min.js
      - name: Compose logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-container
      cancel-in-progress: true
    env:
      IMAGE: ghcr.io/forke24x7/mp3segmentcut
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and publish container
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/^LABEL org.opencontainers.image.version="\([0-9]*\.[0-9]*\.[0-9]*\)" .*/\1/p' Dockerfile)
          test -n "$version"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --driver docker-container
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -t "$IMAGE:latest" -t "$IMAGE:$version" .
