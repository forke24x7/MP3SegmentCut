server {
    listen 80;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }
}
